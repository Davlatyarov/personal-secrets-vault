services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    container_name: vaultwarden-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      # Bound strictly to loopback to prevent direct external bypass of Nginx TLS
      - "127.0.0.1:8088:80"
    cpu_quota: 50000
    cpu_period: 100000
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
